name: Update Lockfile

# 为 PR 加上 update-lockfile 标签后运行：按 PR 中的 package.json 重新生成 pnpm-lock.yaml，并提交到这个 PR 的分支。
# 用于依赖升级：本地只修改 package.json 中的版本号，锁文件在 CI 环境中生成，不需要在本地安装依赖。
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update lockfile
    # 来自 fork 的 PR 取不到密钥，也不应改写锁文件
    if: >-
      github.event.label.name == 'update-lockfile' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 用 GitHub App 的令牌推送。由默认 GITHUB_TOKEN 推送的提交不会触发 PR 检查，
      # 在要求检查必须通过的规则下，这个 PR 将无法合并。
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # dedupe 让各包作为 peer 安装的依赖与根目录使用同一版本。
      # 只升级根目录时，旧版本会留在锁文件里，例如两份 Mantine 并存时测试找不到 MantineProvider。
      # 这里只需要锁文件，--ignore-scripts 不运行依赖的安装脚本，这些脚本也就读不到推送用的令牌。
      - name: Update lockfile
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm dedupe --ignore-scripts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is unchanged."
          else
            git commit -m "deps: 重新生成 pnpm-lock.yaml"
            git push
          fi

      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label update-lockfile || true
