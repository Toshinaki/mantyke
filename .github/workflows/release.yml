name: Release

on:
  workflow_run:
    workflows: ['Master Branch CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  pull-requests: write
  id-token: write # 必需：为 OIDC 颁发 token
  contents: write # 必需：创建 GitHub Release 和提交版本更新

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Release packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 用 GitHub App 的令牌创建和更新 Version Packages PR。
      # 由默认 GITHUB_TOKEN 引发的事件不会触发其他工作流，PR 检查就不会运行，
      # 在要求检查必须通过的规则下，这个 PR 将无法合并。
      # App 需要 Contents、Pull requests、Workflows 三项读写权限（发布分支会带上工作流文件的改动）。
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # changesets/action v2 默认通过 GitHub API 推送，不依赖这里保存的凭据；
      # 仍然使用 App 的令牌，保证改用 git 命令推送时也以 App 的身份进行
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Nx cache
        uses: nrwl/nx-set-shas@v5

      - name: Build all packages
        # 各包的 build target 都执行根目录的 pnpm run build（构建全部包），并行运行会争用 temp/ 目录
        run: pnpm run build

      # 有未消费的 changeset 时创建或更新 Version Packages PR；
      # 没有时执行 publish，只发布 npm 上还不存在的版本，没有新版本则不发布任何包
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 起令牌通过输入传入，不再读取环境变量 GITHUB_TOKEN
          github-token: ${{ steps.app-token.outputs.token }}
          # changeset publish 不接受额外参数。
          # 公开访问由各包 package.json 的 publishConfig.access 指定，来源证明通过下方环境变量开启。
          publish-script: pnpm release
          commit-message: 'chore: release packages'
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Release summary
        if: always()
        run: |
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "✅ Packages published successfully"
            echo "Published packages: ${{ steps.changesets.outputs.published-packages }}"
          elif [ "${{ steps.changesets.outputs.has-changesets }}" = "true" ]; then
            echo "📝 Release PR created or updated: #${{ steps.changesets.outputs.pr-number }}"
          else
            echo "ℹ️ No changes to release"
          fi
