version: 2

# npm 依赖的版本升级不再由 Dependabot 负责，改由每周运行的 .github/workflows/weekly-deps.yml 汇总成一个 PR。原因：
# - 版本号必须保持一致的包会被拆进不同的 PR。例如 vitest 与 @vitest/*、nx 与 @nx/* 是同一套工具的各个部分，
#   一起发版，版本不同时互相不兼容。原先这里按包名配置了"构建工具""测试工具"等分组，每组一个 PR，
#   一个包同时匹配几个分组时归入配置中排在前面的那个：vitest 被排在前面的测试组（`vitest*`）收走，
#   @vitest/* 不匹配 `vitest*`，被构建工具组（`*vite*`）收走。分组只收 minor / patch 升级，大版本升级每个包单独一个 PR；
#   忽略大版本升级的规则只写了 nx，没写 @nx/*，于是出现了只把一个 @nx/* 包升到新大版本、nx 仍留在旧大版本的 PR。
# - Dependabot 不运行 pnpm dedupe（合并锁文件中同一个包的多个版本）。pnpm 会为 packages/ 下的各包自动安装 Mantine 等
#   peer 依赖（应由使用方提供的依赖）并在锁文件里记下版本；只升级根目录的 Mantine 时，这些记录停在旧版本，测试报「MantineProvider was not found」。
#   原因见 weekly-deps.yml 中 Regenerate lockfile 步骤的注释。
# Dependabot 的安全更新是仓库设置（Settings → Code security → Dependabot security updates），不受这个文件影响：
# 开启后，即使这里没有 npm 的配置，有漏洞的依赖也会收到安全更新的 PR。2026-11 时这项设置没有开启。
updates:
  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    assignees:
      - 'Toshinaki' # Replace with your GitHub username
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
