version: 2

# npm 依赖的版本升级不再由 Dependabot 负责，改由每周运行的 .github/workflows/weekly-deps.yml 汇总成一个 PR：
# Dependabot 按类别分组，会把必须一起升级的包拆进不同的 PR（nx 与 @nx/*、vitest 与 @vitest/*），也不运行 pnpm dedupe。
# Dependabot 的安全更新是仓库设置（Settings → Code security → Dependabot security updates），不受这个文件影响：
# 开启后，即使这里没有 npm 的配置，有漏洞的依赖也会收到安全更新的 PR。
updates:
  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    assignees:
      - 'Toshinaki' # Replace with your GitHub username
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
